    <style>
      /**
       * Minimum styles required to render splash.
       *
       * ALL OTHER STYLES BELONG IN `src/style.css`
       *
       * THIS NEEDS TO BE DUPLICATED IN `bskyweb/templates/base.html`
       */
      @font-face {
        font-family: 'InterVariable';
        src: url(/static/media/InterVariable.c504db5c06caaf7cdfba.woff2) format('woff2');
        font-weight: 300 1000;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'InterVariableItalic';
        src: url(/static/media/InterVariable-Italic.01dcbad1bac635f9c9cd.woff2) format('woff2');
        font-weight: 300 1000;
        font-style: italic;
        font-display: swap;
      }
      html {
        background-color: white;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background-color: black;
        }
      }
      html,
      body {
        margin: 0px;
        padding: 0px;
        font-family: InterVariable, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Liberation Sans', Helvetica, Arial, sans-serif;
        text-rendering: optimizeLegibility;
        /* Platform-specific reset */
        -webkit-overflow-scrolling: touch;
        -webkit-text-size-adjust: 100%;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        -ms-overflow-style: scrollbar;
        font-synthesis-weight: none;
      }
      html,
      body,
      #root {
        display: flex;
        flex: 1 0 auto;
        min-height: 100%;
        width: 100%;
      }
      #splash {
        display: flex;
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        align-items: center;
        justify-content: center;
      }
      #splash svg {
        position: relative;
        top: -50px;
        width: 100px;
      }
      /**
       * We need these styles to prevent shifting due to scrollbar show/hide on
       * OSs that have them enabled by default. This also handles cases where the
       * screen wouldn't otherwise scroll, and therefore hide the scrollbar and
       * shift the content, by forcing the page to show a scrollbar.
       */
      body {
        width: 100%;
        overflow-y: scroll;
      }
    </style>
  </head>

  <body>
    <!-- BEGIN public-site-body -->
    <h1 id="aqua-home-heading" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);clip-path:inset(50%);white-space:nowrap;border:0;">Aqua</h1>
    <script>(function(){
  var suffixes = [".bsky.social",".bsky.app",".bsky.team"];
  var site = "https://aquaapp.systems";
  var path = (location.pathname || "/").split("?")[0].replace(/\/+$/, "") || "/";
  if (path.charAt(0) !== "/") path = "/" + path;
  var canonical = path === "/" ? site + "/" : site + path;
  var match = /^\/profile\/([^/]+)\/post\/([^/]+)$/i.exec(path);
  if (match) {
    var handle = match[1];
    var rkey = match[2];
    try { handle = decodeURIComponent(handle); } catch (e) {}
    try { rkey = decodeURIComponent(rkey); } catch (e) {}
    var hosted = false;
    var lower = handle.toLowerCase();
    for (var i = 0; i < suffixes.length; i++) {
      if (lower.slice(-suffixes[i].length) === suffixes[i]) hosted = true;
    }
    if (hosted) {
      canonical = "https://bsky.app/profile/" + encodeURIComponent(handle) + "/post/" + encodeURIComponent(rkey);
    } else {
      canonical = site + "/profile/" + encodeURIComponent(handle) + "/post/" + encodeURIComponent(rkey);
    }
  }
  var link = document.getElementById("canonical");
  if (link) link.setAttribute("href", canonical);
  var og = document.querySelector('meta[property="og:url"]');
  if (og) og.setAttribute("content", canonical);
  var heading = document.getElementById("aqua-home-heading");
  if (heading && path !== "/") heading.remove();
})();</script>
    <!-- END public-site-body -->

            >
              Reload
            </button>
          </p>
        </div>
      </form>
    </noscript>
