<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Unidade de Inteligência">
  <!-- Logo da U.I. (2026-10): vidro facetado com olhos de pílula, anel de planeta e bolinhas em órbita.
       O anel passa por trás e pela frente do corpo. Animação leve; parada para quem prefere menos movimento. -->
  <defs>
    <linearGradient id="corpo" x1="0.2" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#a77bff"/>
      <stop offset="0.4" stop-color="#5b45f2"/>
      <stop offset="0.78" stop-color="#4a8cff"/>
      <stop offset="1" stop-color="#8fdcff"/>
    </linearGradient>
    <linearGradient id="borda" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="0.5" stop-color="#c9b8ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#a8e6ff" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="vidro" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".6"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="anel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a99bff"/>
      <stop offset="0.5" stop-color="#e9e4ff"/>
      <stop offset="1" stop-color="#9fc8ff"/>
    </linearGradient>
    <radialGradient id="bola" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#a99bff"/>
      <stop offset="1" stop-color="#5a4cf0"/>
    </radialGradient>
    <radialGradient id="chao" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6f7dff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#6f7dff" stop-opacity="0"/>
    </radialGradient>
    <filter id="aura" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <!-- metade de baixo do anel passa na frente do corpo -->
    <clipPath id="frente"><rect x="0" y="214" width="400" height="186"/></clipPath>
  </defs>
  <style>
    .flutua { animation: flutuar 4.5s ease-in-out infinite; }
    .chao { animation: sombra 4.5s ease-in-out infinite; transform-origin: 200px 368px; }
    .olho { transform-box: fill-box; transform-origin: center; animation: piscar 5s ease-in-out infinite; }
    .orbita { transform-origin: 200px 214px; animation: girar 18s linear infinite; }
    .orbita.b { animation-duration: 26s; animation-direction: reverse; }
    .anel-luz { animation: brilho 3.2s ease-in-out infinite; }
    @keyframes flutuar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @keyframes sombra { 0%, 100% { transform: scaleX(1); opacity: 1; } 50% { transform: scaleX(.86); opacity: .7; } }
    @keyframes piscar { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes girar { to { transform: rotate(360deg); } }
    @keyframes brilho { 0%, 100% { opacity: .35; } 50% { opacity: .9; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <ellipse class="chao" cx="200" cy="368" rx="130" ry="16" fill="url(#chao)"/>

  <g class="orbita">
    <circle cx="200" cy="214" r="160" fill="none" stroke="#b9b0ff" stroke-opacity=".35" stroke-width="1.2"/>
    <circle cx="200" cy="54" r="5" fill="url(#bola)"/>
    <circle cx="360" cy="214" r="4" fill="url(#bola)"/>
    <circle cx="200" cy="374" r="4.5" fill="url(#bola)"/>
    <circle cx="40" cy="214" r="5" fill="url(#bola)"/>
  </g>
  <g class="orbita b">
    <circle cx="322" cy="96" r="17" fill="url(#bola)"/>
    <circle cx="78" cy="334" r="15" fill="url(#bola)"/>
  </g>

  <g class="flutua">
    <!-- anel de trás -->
    <g transform="rotate(-11 200 214)">
      <ellipse cx="200" cy="214" rx="186" ry="40" fill="none" stroke="url(#anel)" stroke-width="16" opacity=".75"/>
      <ellipse cx="200" cy="214" rx="164" ry="30" fill="none" stroke="#ffffff" stroke-width="2" opacity=".6"/>
    </g>

    <!-- corpo de vidro -->
    <polygon points="309.0,245.2 245.2,309.0 154.8,309.0 91.0,245.2 91.0,154.8 154.8,91.0 245.2,91.0 309.0,154.8"
             fill="#6a5cff" filter="url(#aura)" opacity=".55"/>
    <polygon points="309.0,245.2 245.2,309.0 154.8,309.0 91.0,245.2 91.0,154.8 154.8,91.0 245.2,91.0 309.0,154.8"
             fill="url(#corpo)" stroke="url(#borda)" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="290.5,237.5 237.5,290.5 162.5,290.5 109.5,237.5 109.5,162.5 162.5,109.5 237.5,109.5 290.5,162.5"
             fill="none" stroke="#ffffff" stroke-opacity=".28" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M162.5,109.5 L237.5,109.5 L268,140 Q200,128 132,140 Z" fill="url(#vidro)"/>
    <path d="M109.5,162.5 L128,148 L128,226 L109.5,237.5 Z" fill="#ffffff" opacity=".18"/>

    <rect class="olho" x="168" y="172" width="15" height="40" rx="7.5" fill="#ffffff"/>
    <rect class="olho" x="217" y="172" width="15" height="40" rx="7.5" fill="#ffffff"/>

    <!-- anel da frente -->
    <g transform="rotate(-11 200 214)" clip-path="url(#frente)">
      <ellipse cx="200" cy="214" rx="186" ry="40" fill="none" stroke="url(#anel)" stroke-width="16" opacity=".85"/>
      <ellipse class="anel-luz" cx="200" cy="214" rx="186" ry="40" fill="none" stroke="#ffffff" stroke-width="3"/>
      <ellipse cx="200" cy="214" rx="164" ry="30" fill="none" stroke="#ffffff" stroke-width="2" opacity=".7"/>
    </g>
  </g>
</svg>
