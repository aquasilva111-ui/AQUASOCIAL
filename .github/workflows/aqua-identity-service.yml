name: AQUA Identity service

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Typecheck and test the identity service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aqua-identity-service
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Install service dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
