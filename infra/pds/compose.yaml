# Compose de referência do PDS oficial da AQUA.
# Espelha https://github.com/bluesky-social/pds/blob/main/compose.yaml
# conferido com a imagem ghcr.io/bluesky-social/pds:0.4 (tag de distribuição
# mais recente no git: v0.4.5051) e com o installer.sh da mesma branch.
# Não sobe nada sozinho. No VPS o instalador grava este arquivo em /pds/compose.yaml.
# Segredos ficam em /pds/pds.env, gerados no servidor. Não coloque segredo aqui.

version: '3.9'
services:
  caddy:
    container_name: caddy
    image: caddy:2
    network_mode: host
    depends_on:
      - pds
    restart: unless-stopped
    environment:
      # Go 1.24+ escuta com Multipath TCP por padrão. Esse é o caminho do
      # CVE-2026-98432 em kernels sem patch. Mantenha esta linha.
      GODEBUG: multipathtcp=0
    volumes:
      - type: bind
        source: /pds/caddy/data
        target: /data
      - type: bind
        source: /pds/caddy/etc/caddy
        target: /etc/caddy
  pds:
    container_name: pds
    image: ghcr.io/bluesky-social/pds:0.4
    network_mode: host
    restart: unless-stopped
    volumes:
      - type: bind
        source: /pds
        target: /pds
    env_file:
      - /pds/pds.env
  watchtower:
    container_name: watchtower
    image: ghcr.io/nicholas-fedor/watchtower:latest
    network_mode: host
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    restart: unless-stopped
    environment:
      WATCHTOWER_CLEANUP: true
      WATCHTOWER_SCHEDULE: '@midnight'
